api:
  dashboard: true
  insecure: true # local Docker only; protect or disable before non-local deployment

entryPoints:
  dev:
    address: ':3100'
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: volleyball-edge
  file:
    directory: /etc/traefik/dynamic
    watch: true

accessLog: {}
log:
  level: INFO
