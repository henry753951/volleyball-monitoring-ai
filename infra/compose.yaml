name: volleyball-monitoring-ai

networks:
  edge:
    name: volleyball-edge
  development:
    name: volleyball-development
  internal:
    name: volleyball-internal
    internal: true

services:
  traefik:
    image: traefik:v3.7.9
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # local dashboard only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks: [edge]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: volleyball
      POSTGRES_PASSWORD: volleyball
      POSTGRES_DB: volleyball
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volleyball -d volleyball"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [internal, development]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redis-data:/data]
    networks: [internal]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-volleyball}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-volleyball-dev-secret}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000" # local SDK/debug access; browser app never receives credentials
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 60
    networks: [internal, edge]
    restart: unless-stopped

  ovenmediaengine:
    image: ovenmedialabs/ovenmediaengine:v0.20.5
    environment:
      OME_API_ACCESS_TOKEN: ${OME_API_ACCESS_TOKEN:?OME_API_ACCESS_TOKEN is required}
      OME_DVR_MAX_DURATION: ${OME_DVR_MAX_DURATION:-21600}
      OME_HOST_IP: ${OME_HOST_IP:-127.0.0.1}
    volumes:
      - ./ome:/opt/ovenmediaengine/bin/origin_conf:ro
      - media-spool:/recordings
      - ome-dvr:/var/lib/ovenmediaengine/dvr
      - ome-logs:/var/log/ovenmediaengine
    ports:
      - "1935:1935"
      - "9999:9999/udp"
      - "127.0.0.1:${OME_API_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=volleyball-edge
      - traefik.http.routers.ome-llhls.rule=PathPrefix(`/ome/`)
      - traefik.http.routers.ome-llhls.entrypoints=websecure
      - traefik.http.routers.ome-llhls.tls=true
      - traefik.http.routers.ome-llhls.priority=120
      - traefik.http.routers.ome-llhls.middlewares=ome-llhls-strip
      - traefik.http.middlewares.ome-llhls-strip.stripprefix.prefixes=/ome
      - traefik.http.services.ome-llhls.loadbalancer.server.port=3333
    networks: [internal, edge]
    restart: unless-stopped

  server:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    env_file: ../.env
    ports:
      - "${SERVER_DEV_BIND:-0.0.0.0}:${SERVER_DEV_PORT:-4000}:4000"
    environment:
      MEDIA_IMPORT_ROOT: /var/lib/volleyball/media-imports
      MEDIA_RECORDING_ROOT: /recordings
      OME_API_ACCESS_TOKEN: ${OME_API_ACCESS_TOKEN:?OME_API_ACCESS_TOKEN is required}
      OME_API_URL: http://ovenmediaengine:8081
    volumes:
      - media-imports:/var/lib/volleyball/media-imports
      - media-spool:/recordings
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      ovenmediaengine: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:4000/health/ready'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=volleyball-edge
      - traefik.http.routers.server-graphql.rule=Path(`/graphql`) || PathPrefix(`/graphql/`)
      - traefik.http.routers.server-graphql.entrypoints=websecure
      - traefik.http.routers.server-graphql.tls=true
      - traefik.http.routers.server-graphql.priority=200
      - traefik.http.routers.server-api.rule=PathPrefix(`/api/`)
      - traefik.http.routers.server-api.entrypoints=websecure
      - traefik.http.routers.server-api.tls=true
      - traefik.http.routers.server-api.priority=200
      - traefik.http.routers.server-ws.rule=PathPrefix(`/ws/`)
      - traefik.http.routers.server-ws.entrypoints=websecure
      - traefik.http.routers.server-ws.tls=true
      - traefik.http.routers.server-ws.priority=200
      - traefik.http.services.server.loadbalancer.server.port=4000
    networks: [internal, edge]
    restart: unless-stopped

  worker-media: &worker
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ../.env
    environment:
      WORKER_ROLE: media
      MEDIA_IMPORT_ROOT: /var/lib/volleyball/media-imports
      MEDIA_INGEST_BASE_URL: rtmp://ovenmediaengine:1935/app
      MEDIA_SPOOL_DIR: /var/lib/volleyball/media-spool
      MEDIA_SOURCE_WORK_ROOT: /var/lib/volleyball/media-imports/.work
      OME_API_ACCESS_TOKEN: ${OME_API_ACCESS_TOKEN:?OME_API_ACCESS_TOKEN is required}
      OME_API_URL: http://ovenmediaengine:8081
      YOUTUBE_FORMAT: ${YOUTUBE_FORMAT:-best[protocol*=m3u8][height=1080][fps>=59][fps<=61][vcodec^=avc][acodec!=none]/bestvideo[height=1080][fps>=59][fps<=61][vcodec^=avc]+bestaudio[acodec^=mp4a]}
      YOUTUBE_EXTRACTOR_ARGS: ${YOUTUBE_EXTRACTOR_ARGS:-youtube:player_client=android_vr}
    volumes:
      - media-imports:/var/lib/volleyball/media-imports
      - media-spool:/var/lib/volleyball/media-spool
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      ovenmediaengine: { condition: service_healthy }
    networks: [internal]
    restart: unless-stopped

  worker-workflow:
    <<: *worker
    environment: { WORKER_ROLE: workflow }
    volumes: []

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    env_file: ../.env
    environment:
      PORT: 3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const response = await fetch('http://localhost:3000/'); if (!response.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      - traefik.enable=true
      - traefik.docker.network=volleyball-edge
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=3000
    networks: [edge]
    restart: unless-stopped

volumes:
  postgres-data: {}
  redis-data: {}
  minio-data: {}
  media-spool: {}
  media-imports: {}
  ome-dvr: {}
  ome-logs: {}
