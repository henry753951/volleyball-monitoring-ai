name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - 'integration/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.31'
          enable-cache: true
          cache-dependency-glob: sdk/uv.lock
      - name: Install frozen SDK test environment
        run: uv sync --project sdk --frozen --extra test
      - name: Verify checksum manifest is reproducible
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.base_ref, 'integration/')) }}
        run: |
          uv run --project sdk --frozen python scripts/refresh_checksums.py
          git diff --exit-code -- SHA256SUMS.txt
      - name: Validate contracts, scaffold, and Prisma structure
        run: |
          uv run --project sdk --frozen python scripts/validate_contracts.py
          uv run --project sdk --frozen python scripts/validate_scaffold.py --skip-checksums
          uv run --project sdk --frozen python scripts/validate_prisma_structure.py
      - name: Run SDK tests
        run: uv run --project sdk --frozen pytest -q sdk/tests

  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: volleyball
          POSTGRES_PASSWORD: volleyball
          POSTGRES_USER: volleyball
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volleyball -d volleyball"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://volleyball:volleyball@localhost:5432/volleyball?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.31'
          enable-cache: true
          cache-dependency-glob: sdk/uv.lock
      - name: Install frozen SDK validator environment
        run: uv sync --project sdk --frozen --extra test
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify formatting and lint
        run: |
          bun run format:check
          bun run lint
      - name: Generate and validate database client
        run: |
          bun run db:generate
          bun run db:validate
      - name: Apply database migrations
        run: bun run db:migrate:deploy
      - name: Verify generated GraphQL schema snapshot
        run: bun run graphql:schema:check
      - name: Run repository validators and TypeScript checks
        run: |
          uv run --project sdk --frozen python scripts/validate_contracts.py
          uv run --project sdk --frozen python scripts/validate_scaffold.py --skip-checksums
          uv run --project sdk --frozen python scripts/validate_prisma_structure.py
          node scripts/validate_typescript_syntax.mjs
          bun run typecheck
      - name: Run database and server tests
        run: bun run test:db-server
      - name: Run remaining JavaScript package tests
        run: |
          bun --cwd packages/contracts test
          bun --cwd worker test
          bun --cwd web test
      - name: Build packages and applications
        run: bun run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize local environment
        run: cp .env.example .env
      - name: Validate Compose app profile
        run: docker compose --env-file .env -f infra/compose.yaml --profile app config --quiet
