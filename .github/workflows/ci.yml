name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.31'
          enable-cache: true
          cache-dependency-glob: sdk/uv.lock
      - name: Install frozen SDK test environment
        run: uv sync --project sdk --frozen --extra test
      - name: Validate contracts, scaffold, and Prisma structure
        run: |
          uv run --project sdk --frozen python scripts/validate_contracts.py
          uv run --project sdk --frozen python scripts/validate_scaffold.py
          uv run --project sdk --frozen python scripts/validate_prisma_structure.py
      - name: Run SDK tests
        run: uv run --project sdk --frozen pytest -q sdk/tests

  typescript:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://volleyball:volleyball@localhost:5432/volleyball?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.31'
          enable-cache: true
          cache-dependency-glob: sdk/uv.lock
      - name: Install frozen SDK validator environment
        run: uv sync --project sdk --frozen --extra test
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Generate and validate database client
        run: |
          bun run db:generate
          bun run db:validate
      - name: Run repository validators and TypeScript checks
        run: |
          uv run --project sdk --frozen bun run validate:all
          bun run typecheck
      - name: Run JavaScript package tests
        run: |
          bun --cwd packages/contracts test
          bun --cwd packages/db test
          bun --cwd server test
          bun --cwd worker test
          bun --cwd web test
      - name: Build packages and applications
        run: bun run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize local environment
        run: cp .env.example .env
      - name: Validate Compose app and dev-ai profiles
        run: docker compose -f infra/compose.yaml --profile app --profile dev-ai config --quiet
