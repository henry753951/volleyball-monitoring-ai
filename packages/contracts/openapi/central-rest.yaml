openapi: 3.1.0
info:
  title: Volleyball Central REST API
  version: 1.4.0
security:
  - sessionCookie: []
paths:
  /api/v1/media/playback-windows:
    post:
      summary: Create a bounded live/archive HLS window
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../media/playback-window-request.schema.json' }
      responses:
        '200':
          description: Playback window descriptor
          content:
            application/json:
              schema: { $ref: '../media/playback-window-descriptor.schema.json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Media not ready
          content:
            { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } }
        '422':
          description: Capture gap
          content:
            { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } }
  /api/v1/media/playback-windows/{windowId}:
    get:
      summary: Get a bounded playback descriptor
      security: []
      parameters: [{ $ref: '#/components/parameters/WindowId' }]
      responses:
        '200':
          description: Playback window descriptor
          content:
            {
              application/json:
                { schema: { $ref: '../media/playback-window-descriptor.schema.json' } },
            }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/WindowExpired' }
  /api/v1/media/playback-windows/{windowId}/manifest.m3u8:
    get:
      summary: Serve the bounded HLS manifest
      security: []
      parameters: [{ $ref: '#/components/parameters/WindowId' }]
      responses:
        '200': { description: HLS playlist, content: { application/vnd.apple.mpegurl: {} } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/WindowExpired' }
  /api/v1/media/playback-windows/{windowId}/segments/{segmentId}:
    get:
      summary: Serve a public immutable media segment
      security: []
      parameters:
        - { $ref: '#/components/parameters/WindowId' }
        - { name: segmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: fMP4 segment, content: { video/mp4: {} } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/WindowExpired' }
  /api/v1/media/playback-windows/{windowId}/media.mp4:
    get:
      summary: Serve bounded progressive media
      security: []
      parameters: [{ $ref: '#/components/parameters/WindowId' }]
      responses:
        '200': { description: MP4 media, content: { video/mp4: {} } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/WindowExpired' }
  /api/v1/media/resolve-cursor:
    post:
      summary: Resolve a presented-frame observation to an authoritative sample
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '../media/playback-cursor.schema.json' } } }
      responses:
        '200':
          {
            description: Resolved anchor,
            content:
              {
                application/json:
                  { schema: { $ref: '../media/resolved-media-anchor.schema.json' } },
              },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          {
            description: Mapping stale,
            content:
              { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } },
          }
        '410': { $ref: '#/components/responses/WindowExpired' }
        '422':
          {
            description: Cursor not ready,
            gap or sample missing,
            content:
              { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } },
          }
  /api/v1/media/frame-step:
    post:
      summary: Resolve a bounded batch of adjacent canonical samples
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '../media/frame-step-request.schema.json' } } }
      responses:
        '200':
          {
            description: Canonical adjacent frame,
            content:
              {
                application/json:
                  { schema: { $ref: '../media/canonical-frame-anchor.schema.json' } },
              },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          {
            description: Mapping stale or window boundary,
            content:
              { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } },
          }
        '410': { $ref: '#/components/responses/WindowExpired' }
        '422':
          {
            description: Adjacent sample not found,
            content:
              { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } },
          }
  /api/v1/ai/callback/{jobId}:
    post:
      summary: Receive idempotent AI callback
      security:
        - aiCallbackBearer: []
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - { name: Authorization, in: header, required: true, schema: { type: string } }
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200': { description: Callback already processed idempotently }
        '202': { description: Accepted }
        '409': { description: Job/submission version mismatch }
        '413': { description: Payload too large }
        '415': { description: Unsupported media/schema/FlatBuffers version }
        '422': { description: Contract or invariant validation failed }
  /api/v1/analysis-runs/{analysisRunId}/analysis-data-manifest:
    get:
      summary: Get the authorized lazy AnalysisData frame manifest
      parameters: [{ $ref: '#/components/parameters/AnalysisRunId' }]
      responses:
        '200':
          description: Versioned AnalysisData manifest with bounded frame-chunk URLs
          content:
            { application/json: { schema: { $ref: '../ai/analysis-data-manifest.schema.json' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/analysis-runs/{analysisRunId}/dataset.zip:
    get:
      summary: Stream an authorized, versioned ML experiment bundle for one completed analysis
      description: Includes the unchanged canonical clip, authoritative AnalysisData/timing artifacts, source and cut metadata, decoded per-frame and event JSONL tables, immutable submission and match context, identity assignments, review corrections, provider/job metadata and SHA-256 checksums. Callback credentials are redacted.
      parameters: [{ $ref: '#/components/parameters/AnalysisRunId' }]
      responses:
        '200': { description: Analysis dataset archive, content: { application/zip: {} } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          {
            description: Completed analysis is missing verifiable AnalysisData,
            clip,
            or canonical timing metadata,
          }
  /api/v1/analysis-runs/{analysisRunId}/analysis-frame-chunks/{chunkIndex}:
    get:
      summary: Get one authorized FlatBuffers AnalysisData frame chunk
      parameters:
        - { $ref: '#/components/parameters/AnalysisRunId' }
        - { name: chunkIndex, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          {
            description: VFC1 AnalysisData frame chunk,
            content: { application/vnd.volleyball.analysis-frame-chunk+flatbuffers;version=1: {} },
          }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    aiCallbackBearer:
      type: http
      scheme: bearer
  parameters:
    WindowId:
      name: windowId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    AnalysisRunId:
      name: analysisRunId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    MediaApiError: { $ref: '../media/media-api-error.schema.json' }
  responses:
    BadRequest:
      description: Malformed media request
      content: { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } }
    Unauthenticated:
      description: Authentication required
      content: { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } }
    Forbidden:
      description: Resource is not accessible
      content: { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } }
    WindowExpired:
      description: Playback window expired
      content: { application/json: { schema: { $ref: '../media/media-api-error.schema.json' } } }
