openapi: 3.1.0
info:
  title: Volleyball Central REST API
  version: 1.1.0
paths:
  /api/v1/media/playback-windows:
    post:
      summary: Create a bounded live/archive HLS window over the full saved capture timeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../media/playback-window-request.schema.json
      responses:
        '200':
          description: Playback window descriptor and full-timeline extent
          content:
            application/json:
              schema:
                $ref: ../media/playback-window-descriptor.schema.json
  /api/v1/media/playback-windows/{windowId}/manifest.m3u8:
    get:
      summary: Serve the bounded HLS manifest; media segments are lazy-loaded by the player
      parameters:
        - in: path
          name: windowId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HLS playlist
          content:
            application/vnd.apple.mpegurl: {}
  /api/v1/media/playback-cursors/resolve:
    post:
      summary: Resolve a browser presented-frame observation to an authoritative capture sample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../media/playback-cursor.schema.json
      responses:
        '200':
          description: Resolved media anchor
          content:
            application/json:
              schema:
                $ref: ../media/resolved-media-anchor.schema.json
        '409': { description: Playback mapping is stale }
        '422': { description: Cursor cannot be resolved to a canonical sample }
  /api/v1/media/frame-step:
    post:
      summary: Resolve the previous or next canonical frame for key-point editing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../media/frame-step-request.schema.json
      responses:
        '200':
          description: Canonical adjacent frame in the current playback window
          content:
            application/json:
              schema:
                $ref: ../media/canonical-frame-anchor.schema.json
        '409': { description: Mapping/window is stale or target frame is outside the current window }
  /api/v1/ai/callback/{jobId}:
    post:
      summary: Receive idempotent progress/failure JSON or completed multipart callback
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Callback already processed idempotently }
        '202': { description: Accepted; completed artifacts may still be ingested }
        '409': { description: Job/submission version mismatch }
        '413': { description: Payload too large }
        '415': { description: Unsupported media/schema/FlatBuffers version }
        '422': { description: Contract or invariant validation failed }
