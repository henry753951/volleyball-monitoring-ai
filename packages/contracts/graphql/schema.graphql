"""Signed 64-bit integer serialized as a decimal string."""
scalar BigInt

type CaptureSession {
  endedAt: DateTime
  health: SourceHealth!
  id: ID!
  matchId: ID!
  sourceLabel: String
  startedAt: DateTime
  status: CaptureStatus!
  timeline: CaptureTimeline
}

enum CaptureStatus {
  FAILED
  FINISHED
  LIVE
  STARTING
  STOPPING
}

type CaptureTimeline {
  availableRanges: [CaptureTimelineRange!]!
  captureSessionId: ID!
  captureStartTimeUs: BigInt!
  liveEdgeCaptureTimeUs: BigInt
  timelineVersion: BigInt!
}

type CaptureTimelineRange {
  discontinuity: Int!
  endUs: BigInt!
  startUs: BigInt!
}

type CourtSideAssignment {
  effectiveFromRallyOrdinal: Int!
  effectiveToRallyOrdinal: Int
  id: ID!
  leftTeamId: ID!
  rightTeamId: ID!
}

input CreateMatchSetupInput {
  leftTeam: TeamSetupInput!
  rightTeam: TeamSetupInput!
  scheduledAt: DateTime
  title: String!
  venue: String
}

scalar DateTime

type Health {
  service: String!
  status: String!
}

scalar JSON

type Match {
  captureSessions: [CaptureSession!]!
  id: ID!
  rosterEntries: [MatchRosterEntry!]!
  scheduledAt: DateTime
  sets: [MatchSet!]!
  status: MatchStatus!
  teams: [Team!]!
  title: String!
  venue: String
}

type MatchRosterEntry {
  id: ID!
  jerseyNumber: String!
  name: String!
  teamId: ID!
}

type MatchSet {
  id: ID!
  leftScore: Int!
  rightScore: Int!
  setNumber: Int!
  sideAssignments: [CourtSideAssignment!]!
  status: SetStatus!
}

enum MatchStatus {
  ARCHIVED
  FINISHED
  LIVE
  PLANNED
}

type Mutation {
  applyAnnotationCommand(command: JSON!): JSON!
  createMatchSetup(input: CreateMatchSetupInput!): Match!
  swapCourtSides(input: SwapCourtSidesInput!): MatchSet!
}

type Player {
  id: ID!
  name: String!
  teamId: ID!
}

type Query {
  annotationRallySnapshot(rallyId: ID!, roomId: String!): JSON
  captureSession(id: ID!): CaptureSession
  health: Health!
  match(id: ID!): Match
  matches: [Match!]!
  viewer: Viewer!
}

input RosterInput {
  jerseyNumber: String!
  name: String!
}

enum SetStatus {
  FINISHED
  LIVE
  PLANNED
}

enum SourceHealth {
  DEGRADED
  HEALTHY
  OFFLINE
  STARTING
}

input SwapCourtSidesInput {
  effectiveFromRallyOrdinal: Int!
  setId: ID!
}

type Team {
  id: ID!
  name: String!
  players: [Player!]!
  shortName: String!
}

input TeamSetupInput {
  name: String!
  roster: [RosterInput!]!
  shortName: String!
}

enum UserRole {
  ADMIN
  ANNOTATOR
  COACH
  OPERATOR
  VIEWER
}

type Viewer {
  displayName: String!
  email: String!
  id: ID!
  role: UserRole!
}
