enum AnnotationStatus {
  OPEN
  READY
  SUBMITTED
  VOIDED
}

"""Signed 64-bit integer serialized as a decimal string."""
scalar BigInt

type CaptureSession {
  endedAt: DateTime
  health: SourceHealth!
  id: ID!
  matchId: ID!
  sourceDurationUs: BigInt
  sourceKind: String!
  sourceLabel: String
  startedAt: DateTime
  status: CaptureStatus!
  timeline: CaptureTimeline
}

enum CaptureStatus {
  FAILED
  FINISHED
  LIVE
  STARTING
  STOPPING
}

type CaptureTimeline {
  availabilityComplete: Boolean!
  availableRanges: [CaptureTimelineRange!]!
  captureSessionId: ID!
  captureStartTimeUs: BigInt!
  gapRanges: [CaptureTimelineRange!]!
  ingestFrontierCaptureTimeUs: BigInt
  liveEdgeCaptureTimeUs: BigInt
  sourceEndCaptureTimeUs: BigInt
  timelineVersion: BigInt!
}

type CaptureTimelineRange {
  discontinuity: Int!
  endUs: BigInt!
  startUs: BigInt!
}

enum CourtSide {
  LEFT
  RIGHT
}

type CourtSideAssignment {
  effectiveFromRallyOrdinal: Int!
  effectiveToRallyOrdinal: Int
  id: ID!
  leftTeamId: ID!
  rightTeamId: ID!
}

input CreateMatchSetupInput {
  leftTeam: TeamSetupInput!
  rightTeam: TeamSetupInput!
  scheduledAt: DateTime
  title: String!
  venue: String
}

scalar DateTime

type Health {
  service: String!
  status: String!
}

scalar JSON

type Match {
  captureSessions: [CaptureSession!]!
  clipPostRollUs: BigInt!
  clipPreRollUs: BigInt!
  id: ID!
  rosterEntries: [MatchRosterEntry!]!
  scheduledAt: DateTime
  sets: [MatchSet!]!
  status: MatchStatus!
  teams: [Team!]!
  title: String!
  venue: String
}

type MatchDeleteReceipt {
  cleanupWarnings: [String!]!
  matchId: ID!
  removedAssetCount: Int!
  removedBytes: String!
}

type MatchRosterEntry {
  id: ID!
  jerseyNumber: String!
  name: String!
  teamId: ID!
}

type MatchSet {
  id: ID!
  leftScore: Int!
  rightScore: Int!
  setNumber: Int!
  sideAssignments: [CourtSideAssignment!]!
  status: SetStatus!
  winningTeamId: ID
}

enum MatchStatus {
  ARCHIVED
  FINISHED
  LIVE
  PLANNED
}

type Mutation {
  applyAnnotationCommand(command: JSON!): JSON!
  assignTrackIdentity(analysisRunId: ID!, rosterEntryId: ID!, trackId: Int!): JSON!
  cancelCorrectionDraft(rallyId: ID!): Rally!
  clearTrackIdentity(analysisRunId: ID!, trackId: Int!): JSON!
  createCorrectionDraft(submissionId: ID!): Rally!
  createMatchSetup(input: CreateMatchSetupInput!): Match!
  deleteMatch(matchId: ID!): MatchDeleteReceipt!
  deleteProcessingRally(rallyId: ID!): Rally!
  retryProcessing(input: RetryProcessingInput!): ProcessingState!
  setTrackIdentityMappingComplete(analysisRunId: ID!, completed: Boolean!): JSON!
  startCapture(input: StartCaptureInput!): CaptureSession!
  startNextSet(input: StartNextSetInput!): MatchSet!
  stopCapture(captureSessionId: ID!): CaptureSession!
  swapCourtSides(input: SwapCourtSidesInput!): MatchSet!
  updateMatch(input: UpdateMatchInput!): Match!
  updateMatchClipPolicy(input: UpdateMatchClipPolicyInput!): Match!
  updateMatchRoster(input: UpdateMatchRosterInput!): Match!
}

type Player {
  id: ID!
  name: String!
  teamId: ID!
}

type ProcessingState {
  rallyId: ID!
  retriedStage: String!
  status: ProcessingStatus!
  submissionId: ID!
}

enum ProcessingStatus {
  AI_PROCESSING
  AI_QUEUED
  ARTIFACT_INGESTING
  CANCELLED
  CLIPPING
  CLIP_QUEUED
  COMPLETED
  FAILED
  IDLE
  SUPERSEDED
}

type Query {
  activeAnnotationRallySnapshot(roomId: String!): JSON
  annotationRallySnapshot(rallyId: ID!, roomId: String!): JSON
  captureSession(id: ID!): CaptureSession
  coachMatchAnalytics(matchId: ID!): JSON
  coachMatchState(matchId: ID!): JSON
  coachRallyReplay(rallyId: ID!): JSON
  health: Health!
  match(id: ID!): Match
  matches: [Match!]!
  viewer: Viewer!
}

type Rally {
  activeSubmissionId: ID
  annotationRevision: BigInt!
  annotationStatus: AnnotationStatus!
  id: ID!
  matchId: ID!
  processingStatus: ProcessingStatus!
  scoreResolutionState: ScoreResolutionState!
  scoringCourtSide: CourtSide
  setId: ID!
}

input RetryProcessingInput {
  rallyId: ID!
}

input RosterEditInput {
  id: ID
  jerseyNumber: String!
  name: String!
}

input RosterInput {
  jerseyNumber: String!
  name: String!
}

enum ScoreResolutionState {
  PENDING
  RESOLVED
  UNKNOWN
}

enum SetStatus {
  FINISHED
  LIVE
  PLANNED
}

enum SourceHealth {
  DEGRADED
  HEALTHY
  OFFLINE
  STARTING
}

input StartCaptureInput {
  ingestPath: String!
  matchId: ID!
  sourceConfigSecretRef: String
  sourceKind: String!
  sourceLabel: String
}

input StartNextSetInput {
  matchId: ID!
  winningTeamId: ID!
}

input SwapCourtSidesInput {
  effectiveFromRallyOrdinal: Int!
  setId: ID!
}

type Team {
  id: ID!
  name: String!
  players: [Player!]!
  shortName: String!
}

input TeamSetupInput {
  name: String!
  roster: [RosterInput!]!
  shortName: String!
}

input UpdateMatchClipPolicyInput {
  matchId: ID!
  postRollSeconds: Int!
  preRollSeconds: Int!
}

input UpdateMatchInput {
  matchId: ID!
  scheduledAt: DateTime
  status: MatchStatus!
  title: String!
  venue: String
}

input UpdateMatchRosterInput {
  matchId: ID!
  roster: [RosterEditInput!]!
  teamId: ID!
}

enum UserRole {
  ADMIN
  ANNOTATOR
  COACH
  OPERATOR
  VIEWER
}

type Viewer {
  displayName: String!
  email: String!
  id: ID!
  role: UserRole!
}
