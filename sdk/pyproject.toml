[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "volleyball-monitoring-ai-sdk"
version = "0.5.0"
description = "Outbound WebSocket worker SDK and wire contracts for external volleyball AI providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "volleyball-monitoring-ai contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "flatbuffers>=25.9.23,<26",
  "websockets>=14,<17",
]

[project.optional-dependencies]
provider = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/volleyball_monitoring_ai"]

[tool.hatch.build.targets.wheel.force-include]
"../packages/contracts/flatbuffers/analysis-data.fbs" = "volleyball_monitoring_ai/schemas/analysis-data.fbs"
"../packages/contracts/flatbuffers/analysis-frame-chunk.fbs" = "volleyball_monitoring_ai/schemas/analysis-frame-chunk.fbs"
"../packages/contracts/flatbuffers/person-pose-evidence.fbs" = "volleyball_monitoring_ai/schemas/person-pose-evidence.fbs"
"../packages/contracts/fixtures/normal-rally/analysis-data-domain.json" = "volleyball_monitoring_ai/fixtures/normal-rally-analysis-data-domain.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["ruff==0.15.22"]
